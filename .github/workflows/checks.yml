name: Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check PR title prefix
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 -c 'import os,re,sys; sys.exit(0 if re.fullmatch(r"\[(FEAT|FIX|CHORE|DOCS|REFACTOR|TEST|CI|PERF|BUILD|REVERT)\] \S.*", os.environ["PR_TITLE"]) else "Use a title such as [FEAT] Description or [FIX] Description")'
  build:
    name: Build and self-test
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate scripts, build Universal app and run self-tests
        shell: bash
        run: bash scripts/validate.sh
      - name: Diagnose a self-test crash
        if: failure()
        shell: bash
        run: |
          for binary in /private/tmp/gksdud-build.*/test/gksdud.app/Contents/MacOS/gksdud; do
            if [[ -f "$binary" ]]; then
              lldb --batch -o run --one-line-on-crash 'thread backtrace all' -- "$binary" --self-test
              break
            fi
          done
